[workspace]
resolver = "2"
members = ["crates/astbox-core", "crates/astbox-cli", "crates/astbox-gui"]

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "MPL-2.0 OR AGPL-3.0-only"
authors = ["Astenyx-Git"]

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"

[profile.test]
opt-level = 1
