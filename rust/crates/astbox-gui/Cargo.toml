[package]
name = "astbox-gui"
description = "ASTBOX v1.0 desktop shell (Tauri v2 port of Astbox.Server GUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
astbox-core = { path = "../astbox-core" }
tauri = { version = "2", features = [] }
# P0#5 锁版本:实际钉版由 Cargo.lock 承担,升级只发生在里程碑之间
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-specta = { version = "2.0.0-rc", features = ["derive", "typescript"] }
specta = "2.0.0-rc"
specta-typescript = "0.0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DPAPI secrets.bin (windows 0.61 already in the lock)
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }
# P5 关联治理: HKCU per-user ProgId/Capabilities/RegisteredApplications
winreg = "0.55"
# Local-time formatting for the snapshot's *_h fields
chrono = "0.4"
